<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Security Cam (Alfred Clone)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #00e676; }
    .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    button { background: #00e676; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px; }
    button:hover { background: #00c853; }
    #qrcode { display: inline-block; background: white; padding: 16px; border-radius: 8px; margin-top: 15px; }
    video { width: 100%; border-radius: 8px; background: #000; margin-top: 15px; }
    #reader { width: 100%; margin-top: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Security Camera</h1>
    <p>Select your mode for this device:</p>

    <div id="mode-selection">
      <button onclick="startViewer()">Monitor / Viewer (PC or Phone 1)</button>
      <button onclick="startCamera()">Camera Streamer (Phone 2)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-panel" class="hidden">
      <h3>Viewer Mode</h3>
      <p>Scan this QR code with your Camera phone:</p>
      <div id="qrcode"></div>
      <video id="remote-video" autoplay playsinline></video>
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-panel" class="hidden">
      <h3>Camera Mode</h3>
      <p id="scan-instructions">Point camera at the QR code on the viewer screen.</p>
      <div id="reader"></div>
      <video id="local-video" autoplay playsinline muted class="hidden"></video>
    </div>
  </div>

  <script>
    let peer = null;

    // --- 1. VIEWER LOGIC ---
    function startViewer() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("viewer-panel").classList.remove("hidden");

      // Generate unique Peer ID
      const viewerId = "alfred-cam-" + Math.floor(1000 + Math.random() * 9000);
      peer = new Peer(viewerId);

      peer.on("open", (id) => {
        // Render QR Code containing the Viewer ID
        new QRCode(document.getElementById("qrcode"), id);
      });

      // Listen for incoming call from camera phone
      peer.on("call", (call) => {
        call.answer(); // Answer without sending video back
        call.on("stream", (remoteStream) => {
          document.getElementById("qrcode").classList.add("hidden");
          const videoElement = document.getElementById("remote-video");
          videoElement.srcObject = remoteStream;
        });
      });
    }

    // --- 2. CAMERA LOGIC ---
    function startCamera() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("camera-panel").classList.remove("hidden");

      peer = new Peer();

      // Start QR Scanner
      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render((qrCodeText) => {
        html5QrcodeScanner.clear(); // Stop scanning once scanned
        document.getElementById("scan-instructions").innerText = "Connecting live stream...";
        connectAndStream(qrCodeText);
      });
    }

    async function connectAndStream(targetPeerId) {
      try {
        // Request access to phone's back camera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: true
        }).catch(async () => {
          // Fallback to default camera if rear camera request fails
          return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        });

        // Display video locally on phone
        const localVideo = document.getElementById("local-video");
        localVideo.srcObject = stream;
        localVideo.classList.remove("hidden");
        document.getElementById("reader").classList.add("hidden");

        // Call the Viewer ID found in QR code and send stream
        peer.call(targetPeerId, stream);
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }
  </script>
</body>
</html>
