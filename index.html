]<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Web Security Camera</title>

  <!-- PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- QR Code Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 15px;
    }


    .card {
      width: 100%;
      max-width: 700px;
      margin: 10px auto;
      background: #222;
      padding: 20px;
      border-radius: 14px;
    }


    h2 {
      color: #00e676;
      margin: 5px 0 20px;
      font-size: 30px;
    }


    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;

      border: 0;
      border-radius: 8px;

      background: #00e676;
      color: #000;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }


    button:hover {
      background: #00c853;
    }


    button:active {
      transform: scale(0.98);
    }


    #status {
      width: 100%;

      padding: 13px;

      margin-bottom: 12px;

      background: #333;

      color: #ffeb3b;

      font-weight: bold;

      border-radius: 8px;

      word-break: break-word;
    }


    #connection-info {
      margin-top: 10px;

      padding: 8px;

      color: #aaa;

      font-size: 13px;

      line-height: 1.5;

      word-break: break-word;
    }


    #qrcode {
      display: inline-block;

      background: #fff;

      padding: 12px;

      margin: 10px 0;

      border-radius: 10px;
    }


    #qrcode img {
      display: block;
    }


    /*
      ============================================================
      LIVE VIDEO
      ============================================================

      The remote WebRTC stream goes DIRECTLY into this video.

      There is no hidden video.
      There is no canvas.
      There is no drawImage().
    */

    #remote-video {
      width: 100%;
      height: auto;

      min-height: 320px;

      display: block;

      background: #000;

      border-radius: 10px;

      object-fit: contain;

      margin-top: 10px;
    }


    /*
      Phone QR scanner.
    */

    #scanner-video {
      width: 100%;
      height: 400px;

      display: block;

      background: #000;

      border-radius: 10px;

      object-fit: cover;

      margin-top: 10px;
    }


    /*
      Used internally for QR scanning.
    */

    #qr-canvas {
      display: none;
    }


    .hidden {
      display: none !important;
    }


    /*
      Small connection indicator.
    */

    .dot {
      display: inline-block;

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #777;

      margin-right: 5px;
    }


    .dot.live {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }


    .dot.error {
      background: #f44336;
    }


    /*
      Loading message over video.
    */

    #video-message {
      padding: 10px;

      margin-top: 8px;

      color: #aaa;

      font-size: 14px;
    }

  </style>

</head>


<body>


  <div class="card">

    <h2>Web Security Camera</h2>


    <!-- STATUS -->

    <div id="status">
      Select Mode Below
    </div>


    <!-- ========================================================
         MAIN MENU
         ======================================================== -->

    <div id="menu">

      <button onclick="setupViewer()">
        1. VIEW SCREEN (PC / Tablet)
      </button>

      <button onclick="setupCamera()">
        2. CAMERA (Phone)
      </button>

    </div>


    <!-- ========================================================
         VIEWER MODE
         ======================================================== -->

    <div
      id="viewer-box"
      class="hidden"
    >


      <!-- QR CODE -->

      <div id="qr-wrap">

        <p>
          Scan this QR code with your phone:
        </p>

        <div id="qrcode"></div>

        <p style="color:#aaa;font-size:13px;">
          Open this page on the phone and choose
          "CAMERA".
        </p>

      </div>


      <!-- LIVE VIDEO -->

      <video
        id="remote-video"
        autoplay
        playsinline
        muted
      ></video>


      <div id="video-message">
        Waiting for camera...
      </div>


      <!-- CONNECTION INFO -->

      <div id="connection-info">

        <span
          id="connection-dot"
          class="dot"
        ></span>

        Waiting for connection...

      </div>


    </div>


    <!-- ========================================================
         CAMERA MODE
         ======================================================== -->

    <div
      id="camera-box"
      class="hidden"
    >

      <p>
        Point the phone camera at the QR code.
      </p>


      <video
        id="scanner-video"
        autoplay
        playsinline
        muted
      ></video>


      <canvas
        id="qr-canvas"
      ></canvas>


    </div>


  </div>



<script>


/*
================================================================
GLOBAL VARIABLES
================================================================
*/

let peer = null;

let cameraStream = null;

let currentCall = null;

let scanning = false;


/*
================================================================
WEBRTC CONFIGURATION
================================================================

STUN helps find a direct connection.

TURN is used when a direct connection isn't possible.

The TURN servers below are public/demo relay servers.
For a real security camera deployment, use your own TURN
server or a trusted TURN provider.
*/

const PEER_CONFIG = {

  iceServers: [

    /*
     * Google STUN
     */

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    },


    /*
     * TURN
     *
     * These allow the video to be relayed when the
     * phone and viewer cannot establish a direct
     * WebRTC connection.
     */

    {
      urls: "turn:openrelay.metered.ca:80",

      username: "openrelayproject",

      credential: "openrelayproject"
    },

    {
      urls: "turn:openrelay.metered.ca:443",

      username: "openrelayproject",

      credential: "openrelayproject"
    },

    {
      urls:
        "turn:openrelay.metered.ca:443?transport=tcp",

      username: "openrelayproject",

      credential: "openrelayproject"
    }

  ]

};



/*
================================================================
UI FUNCTIONS
================================================================
*/

function log(message) {

  console.log(message);

  document.getElementById(
    "status"
  ).innerText = message;

}



function show(id) {

  document
    .getElementById(id)
    .classList
    .remove("hidden");

}



function hide(id) {

  document
    .getElementById(id)
    .classList
    .add("hidden");

}



function setConnectionState(
  state,
  message
) {

  const dot =
    document.getElementById(
      "connection-dot"
    );


  dot.className = "dot";


  if (state === "live") {

    dot.classList.add("live");

  }


  if (state === "error") {

    dot.classList.add("error");

  }


  document.getElementById(
    "connection-info"
  ).innerText = message;

}



/*
================================================================
CLEANUP
================================================================
*/

function cleanup() {

  console.log("Cleaning up...");


  if (currentCall) {

    try {
      currentCall.close();
    } catch (e) {}

    currentCall = null;

  }


  if (peer) {

    try {
      peer.destroy();
    } catch (e) {}

    peer = null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    cameraStream = null;

  }


  const remoteVideo =
    document.getElementById(
      "remote-video"
    );


  if (remoteVideo) {

    remoteVideo.srcObject = null;

  }

}



/*
================================================================
VIEWER MODE
================================================================
*/

function setupViewer() {

  console.log(
    "=============================="
  );

  console.log(
    "STARTING VIEWER"
  );

  console.log(
    "=============================="
  );


  hide("menu");

  show("viewer-box");


  log(
    "Connecting to signaling server..."
  );


  setConnectionState(
    "connecting",
    "Connecting..."
  );


  /*
   * Generate a random ID for this viewer.
   */

  const viewerId =
    "cam-" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );


  console.log(
    "Viewer ID:",
    viewerId
  );


  /*
   * Create PeerJS peer.
   */

  peer = new Peer(
    viewerId,
    {

      debug: 2,

      config: PEER_CONFIG

    }
  );



  /*
  ================================================================
  PEER OPEN
  ================================================================
  */

  peer.on(
    "open",
    function(id) {

      console.log(
        "PeerJS connected."
      );


      console.log(
        "Viewer ID:",
        id
      );


      /*
       * Generate QR code.
       */

      const qr =
        document.getElementById(
          "qrcode"
        );


      qr.innerHTML = "";


      new QRCode(
        qr,
        {

          text: id,

          width: 240,

          height: 240,

          correctLevel:
            QRCode.CorrectLevel.M

        }
      );


      log(
        "Ready! Scan the QR code with the phone."
      );


      setConnectionState(
        "connecting",
        "Waiting for phone..."
      );

    }
  );



  /*
  ================================================================
  INCOMING CALL
  ================================================================
  */

  peer.on(
    "call",
    function(call) {

      console.log(
        "================================"
      );

      console.log(
        "INCOMING CALL"
      );

      console.log(
        "================================"
      );


      console.log(
        "Call:",
        call
      );


      currentCall = call;


      log(
        "Phone connected. Answering..."
      );


      setConnectionState(
        "connecting",
        "Phone connected..."
      );


      /*
       * Answer without sending anything
       * back to the camera.
       */

      call.answer();



      /*
      ============================================================
      REMOTE STREAM
      ============================================================
      */

      call.on(
        "stream",
        async function(remoteStream) {

          console.log(
            "================================"
          );

          console.log(
            "REMOTE STREAM RECEIVED"
          );

          console.log(
            "================================"
          );


          console.log(
            "Remote stream:",
            remoteStream
          );


          /*
           * Print every track.
           */

          const tracks =
            remoteStream.getTracks();


          console.log(
            "Remote tracks:",
            tracks
          );


          tracks.forEach(
            function(track) {

              console.log(
                "Track:",
                track.kind,
                "state:",
                track.readyState,
                "enabled:",
                track.enabled,
                "muted:",
                track.muted
              );

            }
          );


          /*
           * Get video tracks.
           */

          const videoTracks =
            remoteStream.getVideoTracks();


          console.log(
            "Video tracks:",
            videoTracks
          );


          /*
           * Make sure we received video.
           */

          if (
            videoTracks.length === 0
          ) {

            log(
              "ERROR: No video track received."
            );


            setConnectionState(
              "error",
              "Connected but no video track."
            );


            return;

          }


          /*
           * Get visible video.
           */

          const video =
            document.getElementById(
              "remote-video"
            );


          /*
           * IMPORTANT:
           *
           * Attach the WebRTC stream directly
           * to the video element.
           */

          video.srcObject =
            remoteStream;


          video.autoplay = true;

          video.playsInline = true;

          video.muted = true;


          /*
           * Hide QR.
           */

          hide("qr-wrap");


          /*
           * Tell user we got the stream.
           */

          log(
            "Video stream received..."
          );


          document.getElementById(
            "video-message"
          ).innerText =
            "Connecting to camera video...";


          /*
           * Explicitly play.
           */

          try {

            await video.play();


            console.log(
              "VIDEO PLAYBACK STARTED"
            );


            log(
              "LIVE STREAM ACTIVE"
            );


            document.getElementById(
              "video-message"
            ).innerText =
              "Live camera feed";


            setConnectionState(
              "live",
              "LIVE • Receiving camera video"
            );

          } catch (error) {

            console.error(
              "Video play error:",
              error
            );


            log(
              "Tap the video to start playback."
            );


            setConnectionState(
              "connecting",
              "Video received • Tap video"
            );

          }



          /*
          ==========================================================
          VIDEO TRACK
          ==========================================================
          */

          const track =
            videoTracks[0];


          console.log(
            "Video track:",
            track
          );


          console.log(
            "Track readyState:",
            track.readyState
          );


          console.log(
            "Track enabled:",
            track.enabled
          );


          console.log(
            "Track muted:",
            track.muted
          );



          /*
           * Track becomes active.
           */

          track.onunmute =
            function() {

              console.log(
                "REMOTE VIDEO TRACK UNMUTED"
              );


              log(
                "LIVE STREAM ACTIVE"
              );


              setConnectionState(
                "live",
                "LIVE • Camera video active"
              );

            };



          /*
           * Track muted.
           */

          track.onmute =
            function() {

              console.log(
                "REMOTE VIDEO TRACK MUTED"
              );


              log(
                "Camera video paused..."
              );

            };



          /*
           * Track ended.
           */

          track.onended =
            function() {

              console.log(
                "REMOTE VIDEO TRACK ENDED"
              );


              log(
                "Camera stopped."
              );


              setConnectionState(
                "error",
                "Camera stopped"
              );

            };



          /*
          ==========================================================
          WAIT 3 SECONDS AND CHECK VIDEO
          ==========================================================
          */

          setTimeout(
            function() {

              console.log(
                "================================"
              );

              console.log(
                "VIDEO DIAGNOSTICS"
              );

              console.log(
                "================================"
              );


              console.log(
                "Video width:",
                video.videoWidth
              );


              console.log(
                "Video height:",
                video.videoHeight
              );


              console.log(
                "Video readyState:",
                video.readyState
              );


              console.log(
                "Video paused:",
                video.paused
              );


              console.log(
                "Track readyState:",
                track.readyState
              );


              console.log(
                "Track muted:",
                track.muted
              );


              /*
               * If video dimensions are zero,
               * frames aren't arriving.
               */

              if (
                video.videoWidth === 0 ||
                video.videoHeight === 0
              ) {

                console.error(
                  "NO VIDEO FRAMES RECEIVED"
                );


                log(
                  "Connected, but no video frames received."
                );


                setConnectionState(
                  "error",
                  "WebRTC connected but video frames are missing"
                );

              } else {

                console.log(
                  "VIDEO FRAMES ARE ARRIVING"
                );


                log(
                  "LIVE STREAM ACTIVE"
                );


                setConnectionState(
                  "live",
                  "LIVE • " +
                  video.videoWidth +
                  "x" +
                  video.videoHeight
                );

              }

            },
            3000
          );

        }
      );



      /*
      ================================================================
      CALL CLOSED
      ================================================================
      */

      call.on(
        "close",
        function() {

          console.log(
            "WebRTC call closed."
          );


          const video =
            document.getElementById(
              "remote-video"
            );


          video.srcObject = null;


          log(
            "Camera disconnected."
          );


          setConnectionState(
            "error",
            "Camera disconnected"
          );

        }
      );



      /*
      ================================================================
      CALL ERROR
      ================================================================
      */

      call.on(
        "error",
        function(error) {

          console.error(
            "WebRTC call error:",
            error
          );


          log(
            "Call error: " +
            (
              error.message ||
              error.type ||
              "Unknown error"
            )
          );


          setConnectionState(
            "error",
            "WebRTC call failed"
          );

        }
      );



      /*
      ================================================================
      PEER CONNECTION DIAGNOSTICS
      ================================================================
      */

      setTimeout(
        function() {

          if (
            call.peerConnection
          ) {

            console.log(
              "RTCPeerConnection found."
            );


            const pc =
              call.peerConnection;


            console.log(
              "ICE state:",
              pc.iceConnectionState
            );


            console.log(
              "Connection state:",
              pc.connectionState
            );


            console.log(
              "Signaling state:",
              pc.signalingState
            );



            pc.addEventListener(
              "iceconnectionstatechange",
              function() {

                console.log(
                  "ICE state:",
                  pc.iceConnectionState
                );


                if (
                  pc.iceConnectionState ===
                  "connected" ||

                  pc.iceConnectionState ===
                  "completed"
                ) {

                  console.log(
                    "ICE CONNECTION SUCCESSFUL"
                  );

                }


                if (
                  pc.iceConnectionState ===
                  "failed"
                ) {

                  console.error(
                    "ICE CONNECTION FAILED"
                  );


                  log(
                    "Network connection failed."
                  );


                  setConnectionState(
                    "error",
                    "WebRTC network connection failed"
                  );

                }

              }
            );



            pc.addEventListener(
              "connectionstatechange",
              function() {

                console.log(
                  "WebRTC connection:",
                  pc.connectionState
                );


                if (
                  pc.connectionState ===
                  "connected"
                ) {

                  console.log(
                    "WEBRTC CONNECTED"
                  );

                }


                if (
                  pc.connectionState ===
                  "failed"
                ) {

                  console.error(
                    "WEBRTC FAILED"
                  );


                  log(
                    "WebRTC connection failed."
                  );


                  setConnectionState(
                    "error",
                    "WebRTC connection failed"
                  );

                }

              }
            );

          }

        },
        1000
      );

    }
  );



  /*
  ================================================================
  PEER ERROR
  ================================================================
  */

  peer.on(
    "error",
    function(error) {

      console.error(
        "PeerJS error:",
        error
      );


      log(
        "Viewer Error: " +
        (
          error.message ||
          error.type ||
          "Unknown error"
        )
      );


      setConnectionState(
        "error",
        "PeerJS error: " +
        (
          error.type ||
          "unknown"
        )
      );

    }
  );



  /*
  ================================================================
  PEER DISCONNECTED
  ================================================================
  */

  peer.on(
    "disconnected",
    function() {

      console.log(
        "PeerJS signaling disconnected."
      );


      log(
        "Signaling server disconnected."
      );


      setConnectionState(
        "error",
        "Signaling server disconnected"
      );

    }
  );



  /*
  ================================================================
  PEER CLOSE
  ================================================================
  */

  peer.on(
    "close",
    function() {

      console.log(
        "Peer closed."
      );

    }
  );

}



/*
================================================================
CAMERA MODE
================================================================
*/

async function setupCamera() {

  hide("menu");

  show("camera-box");


  log(
    "Opening phone camera..."
  );


  const video =
    document.getElementById(
      "scanner-video"
    );


  const canvas =
    document.getElementById(
      "qr-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  try {

    /*
     * Request rear camera.
     */

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });



    console.log(
      "CAMERA STREAM:"
    );

    console.log(
      cameraStream
    );


    console.log(
      "CAMERA TRACKS:"
    );

    console.log(
      cameraStream.getTracks()
    );



    /*
     * Attach camera to scanner.
     */

    video.srcObject =
      cameraStream;


    video.autoplay = true;

    video.playsInline = true;

    video.muted = true;



    /*
     * Play camera.
     */

    await video.play();


    log(
      "Point camera at the QR code."
    );


    scanning = true;


    /*
    ==============================================================
    QR SCANNER LOOP
    ============================================================== 
    */

    function scanFrame() {

      if (!scanning) {
        return;
      }


      /*
       * Make sure camera actually has frames.
       */

      if (

        video.readyState >=
        HTMLMediaElement.HAVE_CURRENT_DATA &&

        video.videoWidth > 0 &&

        video.videoHeight > 0

      ) {


        canvas.width =
          video.videoWidth;


        canvas.height =
          video.videoHeight;


        /*
         * Copy camera frame into canvas.
         *
         * This canvas is ONLY for detecting
         * the QR code.
         */

        ctx.drawImage(

          video,

          0,

          0,

          canvas.width,

          canvas.height

        );


        try {

          const imageData =
            ctx.getImageData(

              0,

              0,

              canvas.width,

              canvas.height

            );


          /*
           * Detect QR code.
           */

          const code =
            jsQR(

              imageData.data,

              imageData.width,

              imageData.height,

              {

                inversionAttempts:
                  "attemptBoth"

              }

            );


          /*
           * QR found.
           */

          if (

            code &&

            code.data &&

            code.data.startsWith("cam-")

          ) {

            scanning = false;


            console.log(
              "QR CODE FOUND:"
            );


            console.log(
              code.data
            );


            log(
              "QR scanned! Starting live stream..."
            );


            /*
             * Hide scanner.
             */

            video.style.display =
              "none";


            /*
             * Send camera to viewer.
             */

            connectToViewer(

              code.data,

              cameraStream

            );


            return;

          }

        } catch (error) {

          console.error(
            "QR scanning error:",
            error
          );

        }

      }


      /*
       * Keep scanning.
       */

      requestAnimationFrame(
        scanFrame
      );

    }


    /*
     * Start scanning.
     */

    requestAnimationFrame(
      scanFrame
    );


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    log(
      "Camera Error: " +
      (
        error.message ||
        "Unable to access camera"
      )
    );

  }

}



/*
================================================================
CONNECT CAMERA TO VIEWER
================================================================
*/

function connectToViewer(
  targetId,
  stream
) {

  console.log(
    "================================"
  );

  console.log(
    "CONNECTING CAMERA"
  );

  console.log(
    "================================"
  );


  console.log(
    "Target viewer:",
    targetId
  );


  console.log(
    "Camera stream:",
    stream
  );


  /*
   * Get camera tracks.
   */

  const tracks =
    stream.getTracks();


  console.log(
    "Tracks:",
    tracks
  );


  /*
   * Make sure there is a video track.
   */

  const videoTracks =
    stream.getVideoTracks();


  if (
    videoTracks.length === 0
  ) {

    log(
      "ERROR: No camera video track."
    );

    return;

  }


  /*
   * Display track information.
   */

  videoTracks.forEach(
    function(track) {

      console.log(
        "Sending video track:",
        track
      );


      console.log(
        "enabled:",
        track.enabled
      );


      console.log(
        "readyState:",
        track.readyState
      );

    }
  );



  /*
   * Create camera PeerJS connection.
   */

  peer = new Peer({

    debug: 2,

    config: PEER_CONFIG

  });



  /*
  ================================================================
  CAMERA PEER OPEN
  ================================================================
  */

  peer.on(
    "open",
    function(myId) {

      console.log(
        "Camera Peer ID:",
        myId
      );


      log(
        "Connecting to viewer..."
      );


      console.log(
        "Calling:",
        targetId
      );


      /*
       * Send camera stream.
       */

      const call =
        peer.call(

          targetId,

          stream

        );


      if (!call) {

        log(
          "ERROR: Could not create call."
        );

        return;

      }


      currentCall = call;


      console.log(
        "Call created:",
        call
      );


      log(
        "LIVE STREAMING TO VIEWER"
      );



      /*
      ==============================================================
      CALL CLOSED
      ============================================================== 
      */

      call.on(
        "close",
        function() {

          console.log(
            "Viewer disconnected."
          );


          log(
            "Viewer disconnected."
          );

        }
      );



      /*
      ==============================================================
      CALL ERROR
      ============================================================== 
      */

      call.on(
        "error",
        function(error) {

          console.error(
            "Camera call error:",
            error
          );


          log(
            "Streaming Error: " +
            (
              error.message ||
              error.type ||
              "Unknown error"
            )
          );

        }
      );



      /*
      ==============================================================
      MONITOR CAMERA TRACK
      ============================================================== 
      */

      videoTracks.forEach(
        function(track) {

          track.onended =
            function() {

              console.log(
                "Camera track ended."
              );


              log(
                "Camera stopped."
              );

            };


          track.onmute =
            function() {

              console.log(
                "Camera track muted."
              );

            };


          track.onunmute =
            function() {

              console.log(
                "Camera track unmuted."
              );


              log(
                "LIVE STREAMING TO VIEWER"
              );

            };

        }
      );



      /*
      ==============================================================
      CAMERA CONNECTION DIAGNOSTICS
      ============================================================== 
      */

      setTimeout(
        function() {

          if (
            call.peerConnection
          ) {

            const pc =
              call.peerConnection;


            console.log(
              "CAMERA ICE STATE:",
              pc.iceConnectionState
            );


            console.log(
              "CAMERA CONNECTION STATE:",
              pc.connectionState
            );


            pc.addEventListener(
              "iceconnectionstatechange",
              function() {

                console.log(
                  "CAMERA ICE:",
                  pc.iceConnectionState
                );


                if (

                  pc.iceConnectionState ===
                  "connected" ||

                  pc.iceConnectionState ===
                  "completed"

                ) {

                  console.log(
                    "CAMERA ICE CONNECTED"
                  );

                }


                if (
                  pc.iceConnectionState ===
                  "failed"
                ) {

                  console.error(
                    "CAMERA ICE FAILED"
                  );


                  log(
                    "Network connection failed."
                  );

                }

              }
            );


            pc.addEventListener(
              "connectionstatechange",
              function() {

                console.log(
                  "CAMERA WEBRTC:",
                  pc.connectionState
                );

              }
            );

          }

        },
        1000
      );

    }
  );



  /*
  ================================================================
  CAMERA PEER ERROR
  ================================================================
  */

  peer.on(
    "error",
    function(error) {

      console.error(
        "Camera PeerJS error:",
        error
      );


      log(
        "Camera Peer Error: " +
        (
          error.message ||
          error.type ||
          "Unknown error"
        )
      );

    }
  );



  /*
  ================================================================
  CAMERA PEER DISCONNECTED
  ================================================================
  */

  peer.on(
    "disconnected",
    function() {

      console.log(
        "Camera PeerJS disconnected."
      );


      log(
        "Signaling connection lost."
      );

    }
  );



  peer.on(
    "close",
    function() {

      console.log(
        "Camera peer closed."
      );

    }
  );

}



/*
================================================================
PAGE CLEANUP
================================================================
*/

window.addEventListener(
  "beforeunload",
  function() {

    cleanup();

  }
);



/*
================================================================
EXTRA VIDEO DEBUGGING
================================================================
*/

const remoteVideo =
  document.getElementById(
    "remote-video"
  );


remoteVideo.addEventListener(
  "loadedmetadata",
  function() {

    console.log(
      "REMOTE VIDEO METADATA LOADED"
    );


    console.log(
      "Width:",
      remoteVideo.videoWidth
    );


    console.log(
      "Height:",
      remoteVideo.videoHeight
    );

  }
);


remoteVideo.addEventListener(
  "playing",
  function() {

    console.log(
      "REMOTE VIDEO PLAYING"
    );


    log(
      "LIVE STREAM ACTIVE"
    );


    setConnectionState(
      "live",
      "LIVE • Camera video active"
    );

  }
);


remoteVideo.addEventListener(
  "waiting",
  function() {

    console.log(
      "REMOTE VIDEO WAITING FOR DATA"
    );

  }
);


remoteVideo.addEventListener(
  "stalled",
  function() {

    console.log(
      "REMOTE VIDEO STALLED"
    );

  }
);


remoteVideo.addEventListener(
  "error",
  function() {

    console.error(
      "REMOTE VIDEO ERROR:",
      remoteVideo.error
    );

  }
);

</script>

</body>
</html>
