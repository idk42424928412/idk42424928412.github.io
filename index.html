<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Security Cam</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #111; 
      color: #fff; 
      text-align: center; 
      margin: 0; 
      padding: 15px; 
    }
    h1 { color: #00e676; margin-bottom: 5px; }
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
    }
    button { 
      background: #00e676; 
      border: none; 
      padding: 14px 20px; 
      font-size: 16px; 
      font-weight: bold; 
      color: #000;
      border-radius: 8px; 
      cursor: pointer; 
      margin: 8px 0; 
      width: 100%;
    }
    #qrcode { 
      display: inline-block; 
      background: white; 
      padding: 12px; 
      border-radius: 8px; 
      margin: 15px 0; 
    }
    #qrcode img { display: block; margin: 0 auto; }
    video { 
      width: 100%; 
      background: #000; 
      border-radius: 8px; 
      margin-top: 10px;
    }
    #status { 
      margin: 10px 0; 
      padding: 8px;
      border-radius: 6px;
      background: #2a2a2a;
      color: #ffeb3b; 
      font-weight: 500;
      font-size: 15px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Security Camera</h1>
    <div id="status">Select mode to start</div>

    <div id="mode-selection">
      <button onclick="startViewer()">Monitor / Viewer (PC)</button>
      <button onclick="startCamera()">Camera Streamer (Phone)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-panel" class="hidden">
      <div id="qr-container">
        <p style="margin: 5px 0;">Scan this with your phone camera:</p>
        <div id="qrcode"></div>
      </div>
      <video id="remote-video" autoplay playsinline muted></video>
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-panel" class="hidden">
      <div id="reader"></div>
      <video id="local-video" autoplay playsinline muted class="hidden"></video>
    </div>
  </div>

  <script>
    let peer = null;

    // Multiple STUN servers for reliable NAT Traversal across networks
    const peerConfig = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' }
        ]
      }
    };

    function setStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // --- VIEWER LOGIC ---
    function startViewer() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("viewer-panel").classList.remove("hidden");
      setStatus("Initializing signaling server...");

      // Generate clean random 6-character ID
      const cleanId = "cam-" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(cleanId, peerConfig);

      peer.on("open", (id) => {
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: id,
          width: 200,
          height: 200
        });
        setStatus("Waiting for phone scan...");
      });

      // Handle incoming video calls
      peer.on("call", (call) => {
        setStatus("Phone connected! Loading stream...");
        call.answer(); // Answer without sending return video

        call.on("stream", (remoteStream) => {
          setStatus("LIVE STREAM ACTIVE");
          document.getElementById("qr-container").classList.add("hidden");
          
          const videoElement = document.getElementById("remote-video");
          videoElement.srcObject = remoteStream;
          
          // Force playback
          const playPromise = videoElement.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              setStatus("Stream Ready! Tap video player to play.");
            });
          }
        });
      });

      peer.on("error", (err) => setStatus("Viewer Error: " + err.type));
    }

    // --- CAMERA LOGIC ---
    function startCamera() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("camera-panel").classList.remove("hidden");
      setStatus("Point camera at QR code");

      peer = new Peer(peerConfig);

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: { width: 220, height: 220 } 
      });

      html5QrcodeScanner.render((targetPeerId) => {
        html5QrcodeScanner.clear();
        setStatus("QR Recognized. Acquiring camera...");
        connectAndStream(targetPeerId);
      });
    }

    async function connectAndStream(targetPeerId) {
      let stream = null;
      
      // Try grabbing environmental (rear) camera first, then fallback to default
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
      } catch (e1) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (e2) {
          setStatus("Camera permission denied!");
          return;
        }
      }

      // Display camera locally on the phone
      const localVideo = document.getElementById("local-video");
      localVideo.srcObject = stream;
      localVideo.classList.remove("hidden");
      document.getElementById("reader").classList.add("hidden");

      setStatus("Dialing Viewer target...");

      // Establish media connection
      const call = peer.call(targetPeerId, stream);

      if (!call) {
        setStatus("Failed to create WebRTC call object.");
        return;
      }

      setStatus("Streaming live to Viewer!");

      peer.on("error", (err) => {
        setStatus("Camera Peer Error: " + err.type);
      });
    }
  </script>
</body>
</html>
