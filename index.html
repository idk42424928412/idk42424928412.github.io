<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Cam</title>
  
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 15px; }
    h2 { color: #00e676; margin: 10px 0; }
    .card { max-width: 450px; margin: 0 auto; background: #222; padding: 20px; border-radius: 10px; }
    button { background: #00e676; color: #000; border: none; padding: 15px; font-weight: bold; width: 100%; border-radius: 6px; margin: 8px 0; font-size: 16px; cursor: pointer; }
    #qrcode { background: white; padding: 10px; display: inline-block; border-radius: 8px; margin: 10px 0; }
    #qrcode img { display: block; margin: 0 auto; }
    video, canvas { width: 100%; background: #000; border-radius: 8px; margin-top: 10px; }
    #status { padding: 10px; background: #333; color: #ffeb3b; font-weight: bold; border-radius: 6px; margin-bottom: 10px; word-break: break-all; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Web Security Camera</h2>
    <div id="status">Select Mode Below</div>

    <div id="menu">
      <button onclick="setupViewer()">1. VIEW SCREEN (PC / Tablet)</button>
      <button onclick="setupCamera()">2. CAMERA (Phone)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-box" class="hidden">
      <div id="qr-wrap">
        <p>Scan with your Phone Camera:</p>
        <div id="qrcode"></div>
      </div>
      <video id="remote-video" autoplay playsinline muted class="hidden"></video>
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-box" class="hidden">
      <video id="scanner-video" autoplay playsinline muted></video>
      <canvas id="qr-canvas" class="hidden"></canvas>
    </div>
  </div>

  <script>
    let peer = null;

    function log(msg) {
      document.getElementById("status").innerText = msg;
    }

    // --- 1. VIEWER LOGIC ---
    function setupViewer() {
      document.getElementById("menu").classList.add("hidden");
      document.getElementById("viewer-box").classList.remove("hidden");
      log("Connecting to Peer Server...");

      const viewerId = "cam-" + Math.floor(100000 + Math.random() * 900000);
      
      peer = new Peer(viewerId, {
        debug: 2,
        config: {
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        }
      });

      peer.on("open", (id) => {
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: id, width: 200, height: 200 });
        log("Ready! Scan QR code using Phone");
      });

      peer.on("call", (call) => {
        log("Incoming connection... Answering stream");
        call.answer();

        call.on("stream", (remoteStream) => {
          log("STREAM LIVE!");
          document.getElementById("qr-wrap").classList.add("hidden");
          const video = document.getElementById("remote-video");
          video.classList.remove("hidden");
          video.srcObject = remoteStream;
          video.play().catch(() => log("Click black screen to play video"));
        });
      });

      peer.on("error", (err) => log("Viewer Error: " + err.type));
    }

    // --- 2. CAMERA & MANUAL QR SCANNER LOGIC ---
    async function setupCamera() {
      document.getElementById("menu").classList.add("hidden");
      document.getElementById("camera-box").classList.remove("hidden");
      log("Opening Phone Camera...");

      const video = document.getElementById("scanner-video");
      const canvas = document.getElementById("qr-canvas");
      const ctx = canvas.getContext("2d");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        log("Point camera directly at QR Code");

        // Scan frame-by-frame using jsQR
        let scanning = true;
        const scanFrame = () => {
          if (!scanning) return;

          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code && code.data && code.data.startsWith("cam-")) {
              scanning = false;
              log("QR Code Scanned! Connecting...");
              connectToViewer(code.data, stream);
              return;
            }
          }
          requestAnimationFrame(scanFrame);
        };

        requestAnimationFrame(scanFrame);

      } catch (err) {
        log("Camera Permission Error: " + err.message);
      }
    }

    function connectToViewer(targetId, cameraStream) {
      peer = new Peer({
        config: {
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        }
      });

      peer.on("open", () => {
        log("Dialing Viewer: " + targetId);
        peer.call(targetId, cameraStream);
        log("Streaming live to screen!");
      });

      peer.on("error", (err) => log("Camera Error: " + err.type));
    }
  </script>
</body>
</html>
