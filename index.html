<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Security Cam</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: #fff; 
      text-align: center; 
      margin: 0; 
      padding: 15px; 
    }
    h1 { color: #00e676; margin-bottom: 10px; }
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
    }
    button { 
      background: #00e676; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: bold; 
      color: #000;
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%;
      margin: 8px 0;
    }
    #qrcode { 
      display: inline-block; 
      background: white; 
      padding: 15px; 
      border-radius: 8px; 
      margin: 15px 0; 
    }
    video { 
      width: 100%; 
      max-height: 450px;
      background: #000; 
      border-radius: 8px; 
      margin-top: 10px;
      object-fit: contain;
    }
    #status { 
      margin: 10px 0; 
      padding: 10px;
      background: #2a2a2a;
      color: #ffeb3b; 
      font-weight: bold;
      border-radius: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Security Camera</h1>
    <div id="status">Select mode to begin</div>

    <div id="mode-selection">
      <button onclick="startViewer()">Monitor / Viewer (PC)</button>
      <button onclick="startCamera()">Camera Streamer (Phone)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-panel" class="hidden">
      <div id="qr-wrapper">
        <p>Scan with your phone camera:</p>
        <div id="qrcode"></div>
      </div>
      <video id="remote-video" autoplay playsinline muted controls class="hidden"></video>
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-panel" class="hidden">
      <div id="reader"></div>
      <video id="local-video" autoplay playsinline muted class="hidden"></video>
    </div>
  </div>

  <script>
    let peer = null;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    };

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // --- VIEWER LOGIC ---
    function startViewer() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("viewer-panel").classList.remove("hidden");
      updateStatus("Generating QR Code...");

      const viewerId = "alfred-" + Math.floor(100000 + Math.random() * 900000);
      peer = new Peer(viewerId, peerConfig);

      peer.on("open", (id) => {
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: id, width: 200, height: 200 });
        updateStatus("Waiting for phone scan...");
      });

      peer.on("call", (call) => {
        updateStatus("Camera connected! Requesting video feed...");

        // Explicitly answer the WebRTC call
        call.answer();

        call.on("stream", (remoteStream) => {
          updateStatus("Live Stream Connected!");

          // Hide QR code and reveal video player
          document.getElementById("qr-wrapper").classList.add("hidden");
          const videoElement = document.getElementById("remote-video");
          videoElement.classList.remove("hidden");

          // Bind stream to element
          videoElement.srcObject = remoteStream;

          // Event triggers to bypass browser playback restrictions
          videoElement.onloadedmetadata = () => {
            videoElement.play().catch(err => {
              updateStatus("Click the black video box to play the stream!");
            });
          };

          // Backup trigger if metadata event fails to fire
          setTimeout(() => {
            if (videoElement.paused) {
              videoElement.play().catch(() => {});
            }
          }, 1000);
        });
      });
    }

    // --- CAMERA LOGIC ---
    function startCamera() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("camera-panel").classList.remove("hidden");
      updateStatus("Point phone camera at the QR code");

      peer = new Peer(peerConfig);

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
      html5QrcodeScanner.render((targetPeerId) => {
        html5QrcodeScanner.clear();
        updateStatus("QR Code Scanned! Opening camera...");
        connectAndStream(targetPeerId);
      });
    }

    async function connectAndStream(targetPeerId) {
      try {
        // Request video stream from rear camera with fallback
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        }).catch(async () => {
          return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        });

        // Show stream locally on phone screen
        const localVideo = document.getElementById("local-video");
        localVideo.srcObject = stream;
        localVideo.classList.remove("hidden");
        document.getElementById("reader").classList.add("hidden");

        updateStatus("Streaming live to PC...");
        
        // Initiate connection to viewer
        peer.call(targetPeerId, stream);

      } catch (err) {
        updateStatus("Camera Error: " + err.message);
      }
    }
  </script>
</body>
</html>
