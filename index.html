<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Security Cam</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #00e676; }
    .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    button { background: #00e676; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px; }
    #qrcode { display: inline-block; background: white; padding: 16px; border-radius: 8px; margin-top: 15px; }
    video { width: 100%; border-radius: 8px; background: #000; margin-top: 15px; }
    #status { margin-top: 10px; font-weight: bold; color: #ffeb3b; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Security Camera</h1>
    <div id="status">Select mode to begin</div>

    <div id="mode-selection">
      <button onclick="startViewer()">Monitor / Viewer (PC)</button>
      <button onclick="startCamera()">Camera Streamer (Phone)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-panel" class="hidden">
      <h3>Viewer Mode</h3>
      <div id="qrcode"></div>
      <video id="remote-video" autoplay playsinline controls></video>
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-panel" class="hidden">
      <h3>Camera Mode</h3>
      <div id="reader"></div>
      <video id="local-video" autoplay playsinline muted class="hidden"></video>
    </div>
  </div>

  <script>
    let peer = null;

    // WebRTC Configuration with Public STUN Servers to bypass NAT/Firewalls
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    };

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // --- VIEWER LOGIC ---
    function startViewer() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("viewer-panel").classList.remove("hidden");
      updateStatus("Generating QR code...");

      const viewerId = "alfred-" + Math.floor(100000 + Math.random() * 900000);
      peer = new Peer(viewerId, peerConfig);

      peer.on("open", (id) => {
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), id);
        updateStatus("Waiting for phone to scan QR code...");
      });

      peer.on("call", (call) => {
        updateStatus("Camera detected! Connecting stream...");
        
        // Answer call
        call.answer();

        call.on("stream", (remoteStream) => {
          updateStatus("Live Stream Connected!");
          document.getElementById("qrcode").classList.add("hidden");
          const videoElement = document.getElementById("remote-video");
          videoElement.srcObject = remoteStream;
          videoElement.play().catch(() => {});
        });

        call.on("error", (err) => updateStatus("Connection Error: " + err));
      });
    }

    // --- CAMERA LOGIC ---
    function startCamera() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("camera-panel").classList.remove("hidden");
      updateStatus("Align QR code inside frame");

      peer = new Peer(peerConfig);

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render((qrCodeText) => {
        html5QrcodeScanner.clear();
        updateStatus("QR Scanned. Starting camera...");
        connectAndStream(qrCodeText);
      });
    }

    async function connectAndStream(targetPeerId) {
      try {
        // Explicit constraints for wide mobile browser compatibility
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        const localVideo = document.getElementById("local-video");
        localVideo.srcObject = stream;
        localVideo.classList.remove("hidden");
        document.getElementById("reader").classList.add("hidden");

        updateStatus("Connecting to Viewer...");
        const call = peer.call(targetPeerId, stream);

        call.on("close", () => updateStatus("Stream Closed"));
        
        // Signal verification
        peer.on("error", (err) => {
          updateStatus("Peer Error: " + err.type);
        });

      } catch (err) {
        updateStatus("Camera Error: " + err.message);
      }
    }
  </script>
</body>
</html>
