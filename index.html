<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Security Cam</title>

  <!-- External Libraries: Socket.io, QRCode, HTML5 Scanner -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: #fff; 
      text-align: center; 
      margin: 0; 
      padding: 15px; 
    }
    h1 { color: #00e676; margin-bottom: 10px; }
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
    }
    button { 
      background: #00e676; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: bold; 
      color: #000;
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%;
      margin: 8px 0;
    }
    #qrcode { 
      display: inline-block; 
      background: white; 
      padding: 15px; 
      border-radius: 8px; 
      margin: 15px 0; 
    }
    #qrcode img { display: block; margin: 0 auto; }
    #stream-canvas, #local-video { 
      width: 100%; 
      max-height: 450px;
      background: #000; 
      border-radius: 8px; 
      margin-top: 10px;
      object-fit: contain;
    }
    #status { 
      margin: 10px 0; 
      padding: 10px;
      background: #2a2a2a;
      color: #ffeb3b; 
      font-weight: bold;
      border-radius: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Security Camera</h1>
    <div id="status">Select mode to begin</div>

    <div id="mode-selection">
      <button onclick="startViewer()">Monitor / Viewer (PC)</button>
      <button onclick="startCamera()">Camera Streamer (Phone)</button>
    </div>

    <!-- VIEWER MODE -->
    <div id="viewer-panel" class="hidden">
      <div id="qr-wrapper">
        <p>Scan with your phone camera:</p>
        <div id="qrcode"></div>
      </div>
      <img id="stream-canvas" class="hidden" alt="Live Feed" />
    </div>

    <!-- CAMERA MODE -->
    <div id="camera-panel" class="hidden">
      <div id="reader"></div>
      <video id="local-video" autoplay playsinline muted class="hidden"></video>
      <canvas id="hidden-canvas" class="hidden"></canvas>
    </div>
  </div>

  <script>
    // Public WebSockets Signaling & Relay server
    const socket = io("https://pie-host.com", { transports: ["websocket"] });
    let roomId = "";

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // --- VIEWER LOGIC ---
    function startViewer() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("viewer-panel").classList.remove("hidden");
      updateStatus("Generating Room Code...");

      roomId = "room-" + Math.floor(100000 + Math.random() * 900000);

      // Display QR Code with room ID
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), { text: roomId, width: 200, height: 200 });
      updateStatus("Waiting for phone to scan QR...");

      socket.emit("join-room", roomId);

      // Listen for video frame broadcasts from the phone
      socket.on("video-frame", (frameData) => {
        updateStatus("LIVE STREAM ACTIVE");
        document.getElementById("qr-wrapper").classList.add("hidden");
        
        const imgDisplay = document.getElementById("stream-canvas");
        imgDisplay.classList.remove("hidden");
        imgDisplay.src = frameData;
      });
    }

    // --- CAMERA LOGIC ---
    function startCamera() {
      document.getElementById("mode-selection").classList.add("hidden");
      document.getElementById("camera-panel").classList.remove("hidden");
      updateStatus("Point camera at the QR code");

      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
      html5QrcodeScanner.render((scannedRoomId) => {
        html5QrcodeScanner.clear();
        updateStatus("QR Code Scanned! Connecting...");
        roomId = scannedRoomId;
        socket.emit("join-room", roomId);
        startBroadcasting();
      });
    }

    async function startBroadcasting() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        }).catch(async () => {
          return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        });

        const video = document.getElementById("local-video");
        video.srcObject = stream;
        video.classList.remove("hidden");
        document.getElementById("reader").classList.add("hidden");

        const canvas = document.getElementById("hidden-canvas");
        const ctx = canvas.getContext("2d");

        updateStatus("Streaming live feed...");

        // Capture frames and emit over WebSocket at ~15 FPS
        setInterval(() => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = 480;
            canvas.height = (video.videoHeight / video.videoWidth) * 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Compress frame to JPEG
            const frame = canvas.toDataURL("image/jpeg", 0.5);
            socket.emit("video-frame", { room: roomId, frame: frame });
          }
        }, 66);

      } catch (err) {
        updateStatus("Camera Error: " + err.message);
      }
    }

    // Socket frame handler mapping
    socket.on("video-frame-relay", (frame) => {
      const imgDisplay = document.getElementById("stream-canvas");
      if (imgDisplay) {
        imgDisplay.classList.remove("hidden");
        document.getElementById("qr-wrapper").classList.add("hidden");
        imgDisplay.src = frame;
        updateStatus("LIVE STREAM ACTIVE");
      }
    });

    socket.on("connect", () => {
      if (roomId) socket.emit("join-room", roomId);
    });
  </script>
</body>
</html>
